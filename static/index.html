<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kaitoon Web Reader: Pembaca komik webtoon dan manga bebas iklan dengan tema OLED Pure Black.">
  <title>Kaitoon Web Reader</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Header Aplikasi -->
  <header id="app-header" class="site-header">
    <div class="header-container">
      <div class="header-main-row">
        <div class="brand" id="brand-logo" role="button" tabindex="0" aria-label="Beranda Kaitoon">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
            <path d="M6 14h6"></path>
          </svg>
          <span class="brand-name">Kaitoon</span>
          <span class="brand-badge">Reader</span>
        </div>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="search-input" placeholder="Cari judul komik..." aria-label="Cari judul komik" autocomplete="off">
          <button id="search-clear-btn" class="clear-btn" aria-label="Hapus pencarian" hidden>&times;</button>
        </div>
      </div>

      <nav class="nav-tabs" aria-label="Navigasi Utama">
        <button class="tab-btn active" id="tab-latest" data-tab="latest">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>Terbaru</span>
        </button>
        <button class="tab-btn" id="tab-favorites" data-tab="favorites">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Favorit</span>
        </button>
        <button class="tab-btn" id="tab-history" data-tab="history">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Riwayat</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Notifikasi Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Area Konten Utama -->
  <main id="app-main" class="main-content">
    <!-- State: Memuat (Loading Spinner) -->
    <div id="global-loader" class="state-container loader-state" hidden aria-label="Memuat data">
      <div class="spinner" aria-hidden="true"></div>
      <p class="state-text">Memuat konten komik...</p>
    </div>

    <!-- State: Terjadi Kesalahan (Error) -->
    <div id="error-state" class="state-container error-state" hidden role="alert">
      <div class="state-icon" aria-hidden="true">!</div>
      <h2 class="state-title" id="error-title">Terjadi Kesalahan</h2>
      <p class="state-text" id="error-message">Gagal menghubungi server backend.</p>
      <button id="retry-btn" class="btn btn-primary">Coba Lagi</button>
    </div>

    <!-- State: Konten Kosong (Empty) -->
    <div id="empty-state" class="state-container empty-state" hidden>
      <div class="state-icon" aria-hidden="true">&#128214;</div>
      <h2 class="state-title" id="empty-title">Tidak Ada Konten</h2>
      <p class="state-text" id="empty-message">Belum ada komik untuk ditampilkan saat ini.</p>
      <button id="empty-action-btn" class="btn btn-primary">Jelajahi Terbaru</button>
    </div>

    <!-- Tampilan 1: Katalog Komik (#catalog-view) -->
    <section id="catalog-view" class="view-section">
      <div class="view-header">
        <div class="view-header-title-group">
          <h1 class="view-title" id="catalog-title">Komik Terbaru</h1>
          <span class="view-subtitle" id="catalog-count"></span>
        </div>
      </div>
      <div id="comic-grid" class="comic-grid" role="list"></div>
      <div id="pagination-controls" class="pagination-bar" hidden>
        <button id="prev-page-btn" class="btn btn-pagination" disabled aria-label="Halaman Sebelumnya">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Sebelumnya</span>
        </button>
        <div class="pagination-badge-wrap">
          <span id="page-num-display" class="page-indicator-text">Halaman 1</span>
        </div>
        <button id="next-page-btn" class="btn btn-pagination" aria-label="Halaman Selanjutnya">
          <span>Selanjutnya</span>
          <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </section>

    <!-- Tampilan 2: Detail Komik (#detail-view) -->
    <section id="detail-view" class="view-section" hidden>
      <div class="detail-nav-bar">
        <button id="detail-back-btn" class="btn btn-secondary nav-back-btn" aria-label="Kembali ke Katalog">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Kembali</span>
        </button>
      </div>
      
      <div class="detail-card">
        <div class="detail-poster-wrap">
          <img id="detail-cover" class="detail-poster" alt="Sampul Komik" referrerpolicy="no-referrer">
        </div>
        <div class="detail-info">
          <h1 id="detail-title" class="detail-title"></h1>
          <p id="detail-alt-title" class="detail-alt-title"></p>
          
          <div class="detail-badges">
            <span id="detail-status" class="pill pill-status"></span>
            <span id="detail-rating" class="pill pill-rating"></span>
            <span id="detail-views" class="pill pill-views"></span>
          </div>

          <div id="detail-genres" class="genres-list" aria-label="Daftar Genre"></div>

          <div class="detail-actions">
            <button id="detail-continue-btn" class="btn btn-primary btn-cta">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Mulai Membaca</span>
            </button>
            <button id="detail-favorite-btn" class="btn btn-secondary btn-fav">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Tambah ke Favorit</span>
            </button>
          </div>

          <div class="synopsis-wrap">
            <h2 class="synopsis-heading">Sinopsis</h2>
            <p id="detail-synopsis" class="detail-synopsis"></p>
          </div>
        </div>
      </div>

      <div class="chapters-section">
        <div class="chapters-header">
          <div class="chapters-header-left">
            <h2 class="section-title">Daftar Chapter</h2>
            <span class="chapter-count-badge" id="detail-chapter-count">0</span>
          </div>
          <div class="chapters-header-right">
            <div class="chapter-search-box">
              <input type="search" id="chapter-filter-input" placeholder="Cari chapter..." aria-label="Cari chapter" autocomplete="off">
            </div>
            <button id="sort-order-btn" class="btn btn-secondary btn-sort" aria-label="Ubah urutan chapter">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
              </svg>
              <span>Urutan: Terbaru &darr;</span>
            </button>
          </div>
        </div>
        <div id="chapter-list" class="chapter-list" role="list"></div>
      </div>
    </section>

    <!-- Tampilan 3: Reader Komik (#reader-view) -->
    <section id="reader-view" class="view-section reader-view" hidden>
      <!-- Auto-hiding Floating Header -->
      <header id="reader-header" class="reader-floating-bar reader-top-bar" role="toolbar" aria-label="Navigasi Reader Atas">
        <div class="reader-bar-left">
          <button id="reader-exit-btn" class="btn btn-secondary reader-btn-icon" title="Kembali ke Detail" aria-label="Kembali ke Detail">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button id="reader-home-btn" class="btn btn-secondary reader-btn-icon" title="Beranda Katalog" aria-label="Beranda Katalog">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
          <div class="reader-title-info">
            <span id="reader-manga-title" class="reader-comic-name"></span>
            <span id="reader-chapter-title" class="reader-ch-name"></span>
          </div>
        </div>
        <div class="reader-bar-right">
          <button id="reader-episodes-btn" class="btn btn-secondary reader-btn-icon" title="Daftar Episode" aria-label="Daftar Episode">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>
          <button id="reader-mode-toggle" class="btn btn-secondary btn-toggle" aria-label="Ganti mode membaca">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12" y2="18"></line>
            </svg>
            <span>Mode: Webtoon</span>
          </button>
          <button id="reader-download-btn" class="btn btn-secondary" aria-label="Unduh Chapter CBZ">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Unduh CBZ</span>
          </button>
        </div>
      </header>

      <!-- Reader Stage Area -->
      <div id="reader-container" class="reader-stage">
        <!-- Mode Webtoon: Kontainer Gulir Vertikal -->
        <div id="webtoon-scroll-container" class="webtoon-container"></div>

        <!-- Mode Manga: Kontainer Slide Halaman Tunggal -->
        <div id="manga-slide-container" class="manga-container" hidden>
          <div class="tap-zone tap-zone-left" id="tap-prev" aria-label="Halaman Sebelumnya" title="Ketuk untuk Halaman Sebelumnya"></div>
          <div class="tap-zone tap-zone-center" id="tap-center" aria-label="Buka Menu Kontrol" title="Ketuk untuk Menu Kontrol"></div>
          <div class="tap-zone tap-zone-right" id="tap-next" aria-label="Halaman Berikutnya" title="Ketuk untuk Halaman Berikutnya"></div>
          <img id="manga-slide-img" class="manga-slide-img" alt="Halaman Manga" referrerpolicy="no-referrer">
        </div>
      </div>

      <!-- Auto-hiding Floating Footer Dock -->
      <footer id="reader-footer" class="reader-floating-bar reader-bottom-bar" role="toolbar" aria-label="Navigasi Reader Bawah">
        <div class="reader-bottom-dock">
          <button id="reader-prev-chapter" class="btn btn-secondary reader-nav-btn reader-btn-icon" aria-label="Chapter Sebelumnya" title="Chapter Sebelumnya">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="11 17 6 12 11 7"></polyline>
              <polyline points="18 17 13 12 18 7"></polyline>
            </svg>
          </button>
          
          <button id="reader-prev-page" class="btn btn-secondary manga-nav-btn reader-btn-icon" aria-label="Halaman Sebelumnya" title="Halaman Sebelumnya" hidden>
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <div class="reader-center-controls">
            <select id="reader-chapter-select" class="chapter-select" aria-label="Pilih Chapter"></select>
            <button id="reader-dock-home-btn" class="btn btn-secondary reader-btn-icon" aria-label="Beranda" title="Beranda">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </button>
            <span id="reader-page-counter" class="page-counter" hidden>Hal 1 / 1</span>
          </div>

          <button id="reader-next-page" class="btn btn-secondary manga-nav-btn reader-btn-icon" aria-label="Halaman Berikutnya" title="Halaman Berikutnya" hidden>
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <button id="reader-next-chapter" class="btn btn-secondary reader-nav-btn reader-btn-icon" aria-label="Chapter Berikutnya" title="Chapter Berikutnya">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="13 17 18 12 13 7"></polyline>
              <polyline points="6 17 11 12 6 7"></polyline>
            </svg>
          </button>
        </div>
      </footer>

      <!-- Drawer Popup Daftar Episode -->
      <div id="episode-drawer" class="episode-drawer" hidden>
        <div class="episode-drawer-backdrop" id="episode-drawer-backdrop"></div>
        <div class="episode-drawer-panel">
          <div class="episode-drawer-header">
            <div class="episode-drawer-title-wrap">
              <h3 class="episode-drawer-title">Daftar Episode</h3>
              <span class="episode-drawer-subtitle" id="episode-drawer-comic-title"></span>
            </div>
            <button id="episode-drawer-close" class="btn btn-ghost drawer-close-btn" aria-label="Tutup daftar episode">&times;</button>
          </div>
          <div class="episode-drawer-search">
            <input type="search" id="episode-search-input" placeholder="Cari nomor chapter..." aria-label="Cari nomor chapter" autocomplete="off">
          </div>
          <div id="episode-drawer-list" class="episode-drawer-list" role="list"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Navigasi Bawah Ponsel">
    <button class="mobile-nav-btn active" id="mobile-tab-latest" data-tab="latest" aria-label="Komik Terbaru">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span class="mobile-nav-label">Terbaru</span>
    </button>
    <button class="mobile-nav-btn" id="mobile-tab-favorites" data-tab="favorites" aria-label="Komik Favorit">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="mobile-nav-label">Favorit</span>
    </button>
    <button class="mobile-nav-btn" id="mobile-tab-history" data-tab="history" aria-label="Riwayat Baca">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span class="mobile-nav-label">Riwayat</span>
    </button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
